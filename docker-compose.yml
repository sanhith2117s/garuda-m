version: '3.8'

services:
  db:
    container_name: garuda_v2_db
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: student_leave_db
    ports:
      - "5433:5432"
    volumes:
      - garuda_v2_postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    container_name: garuda_v2_backend
    build: 
      context: ./backend
    env_file:
      - .env
    environment:
      - DB_TYPE=${DB_TYPE:-sqlite}
      - SQLITE_DB_NAME=data/gate_pass.db
      - DATABASE_URL=postgresql://user:password@db:5432/student_leave_db
      - SECRET_KEY=supersecretkey_change_in_production
      - ENVIRONMENT=development
    volumes:
      - garuda_v2_sqlite_data:/app/data
    ports:
      - "8001:8000"
    depends_on:
      - db
    restart: always

  frontend:
    container_name: garuda_v2_frontend
    build:
      context: ./frontend
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://localhost:8080/api
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: always

  nginx:
    container_name: garuda_v2_nginx
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  garuda_v2_postgres_data:
  garuda_v2_sqlite_data:

