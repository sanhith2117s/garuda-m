events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name _;

        resolver 127.0.0.11 valid=5s;

        # Frontend Application (SPA Routing)
        location / {
            set $frontend_target http://frontend:80;
            proxy_pass $frontend_target;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Backend API
        location /api/ {
            set $backend_target http://backend:8000;
            proxy_pass $backend_target;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # SSE Realtime updates
        location /api/stream {
            set $stream_target http://backend:8000/stream;
            proxy_pass $stream_target;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            proxy_cache off;
            proxy_read_timeout 24h;
        }
    }
}
